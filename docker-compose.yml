version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transformo_docs_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./storage/transformo_docs.db
      - UPLOAD_DIR=./storage
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./storage:/app/storage
    restart: always

  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: transformo_docs_bot
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - api
    restart: always
